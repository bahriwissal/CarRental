[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's `Depends(...)` in argument defaults is idiomatic
